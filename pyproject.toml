[project]
name = "fds"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.15.0",
    "fastapi>=0.141.1",
    "lightgbm>=4.7.0",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "redis>=8.0.1",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# so tests can `from core.features import ...` without a src layout
pythonpath = ["."]
